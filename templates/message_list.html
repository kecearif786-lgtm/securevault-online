{% extends "base.html" %}{% block content %}<h1>{{title}}</h1><section class="card">{% if messages %}{% for m in messages %}<div class="message-row"><a href="{{url_for('view_message',message_id=m.id)}}">{{m.subject}}</a><span>{% if kind=='inbox' %}Dari: {{m.sender}}{% else %}Kepada: {{m.recipient}}{% endif %}</span><small>{{m.created_at}}</small></div>{% endfor %}{% else %}<p>Belum ada pesan.</p>{% endif %}</section>{% endblock %}
