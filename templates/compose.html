{% extends "base.html" %}{% block content %}<h1>Tulis Pesan</h1><section class="card"><form id="sendForm" method="post"><label>Username penerima</label><input name="recipient" required><label>Subjek</label><input name="subject" maxlength="120" required><label>Isi pesan</label><textarea id="plain" rows="5" required></textarea><label>Passphrase bersama (bukan password akun)</label><input id="passphrase" type="password" minlength="10" required><p class="hint">Penerima harus memakai passphrase yang sama untuk membuka pesan. Sepakati passphrase melalui saluran lain.</p><button type="button" id="encryptBtn">Enkripsi pesan</button><div id="cryptoStatus" class="hint"></div><input type="hidden" name="ciphertext" id="ciphertext"><input type="hidden" name="salt" id="salt"><input type="hidden" name="iv" id="iv"><input type="hidden" name="signature" id="signature"><input type="hidden" name="pubkey" id="pubkey"><button type="submit" id="sendBtn" disabled>Kirim pesan terenkripsi</button></form></section><script src="{{url_for('static',filename='js/crypto.js')}}"></script>{% endblock %}
